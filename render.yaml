services:
  - type: web
    name: ai-food-waste-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: MODEL_PATH
        value: models/best.pt
      - key: DEVICE
        value: cpu
      - key: CONF_THRESHOLD
        value: "0.25"
      - key: SURE_CONF
        value: "0.60"
      - key: TRAY_CROP
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: INFER_IMGSZ
        value: "320"
      - key: INFER_MAX_SIDE
        value: "720"
      - key: DEMO_LIMIT
        value: "1"
      - key: FLASK_THREADED
        value: "0"
