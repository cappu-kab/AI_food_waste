<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>แดชบอร์ดโรงเรียน — Food Waste Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="private-layout">
    <div id="app-sidebar"></div>
    <main class="private-main">
      <div class="page-title-row">
        <div>
          <h1>School Dashboard</h1>
          <p class="page-sub"><span data-school-name></span> — ตัวเลขสำคัญก่อน สูตรซ่อนไว้</p>
        </div>
        <label class="switch"><input type="checkbox" id="simple-toggle" checked /> Simple Mode</label>
      </div>

      <div id="content"></div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/formulas.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!FW.initPrivatePage("dashboard")) throw new Error("auth");
    const F = FW_FORMULAS;
    const simpleToggle = document.getElementById("simple-toggle");
    simpleToggle.checked = FW.isSimpleMode();
    simpleToggle.addEventListener("change", () => { FW.setSimpleMode(simpleToggle.checked); render(); });

    function render() {
      const meal = FW.getLatestMeal();
      const root = document.getElementById("content");
      if (!meal) {
        root.innerHTML = FW.emptyState("ยังไม่มีมื้ออาหาร", ["ไปที่หน้า Kitchen Input", "หรือกด Load demo day"]);
        return;
      }
      const a = F.analyzeMealWaste(meal);
      const vs = FW_DATA.vsLastWeekPct;
      const trendCls = vs < 0 ? "trend-down" : "trend-up";
      const trendArrow = vs < 0 ? "↓" : "↑";
      const series = FW_DATA.mockWastePerPerson7d.slice();
      series[6] = Math.round(a.wastePerPerson * 1000); // g

      const top = Object.entries(a.wasteByCategory)
        .sort((x, y) => y[1] - x[1])
        .slice(0, 3);

      const simple = FW.isSimpleMode();

      root.innerHTML = `
        <div class="kpi-grid" style="margin-bottom:1.25rem">
          <div class="card kpi">
            <div class="kpi-label">Today's Food Waste</div>
            <div class="kpi-value">${F.roundDisplay(a.wasteTotal, "kg")}<span class="kpi-unit">kg</span></div>
            <div class="kpi-meta">${FW.badge("Calculated")} จาก Unserved + Plate</div>
          </div>
          <div class="card kpi">
            <div class="kpi-label">Waste / Person</div>
            <div class="kpi-value">${Math.round(a.wastePerPerson * 1000)}<span class="kpi-unit">g</span></div>
            <div class="kpi-meta">${FW.badge("Calculated")}</div>
          </div>
          <div class="card kpi">
            <div class="kpi-label">Waste Rate</div>
            <div class="kpi-value">${F.roundDisplay(a.wasteRate, "pct")}<span class="kpi-unit">%</span></div>
            <div class="kpi-meta">${FW.badge("Calculated")}</div>
          </div>
          <div class="card kpi">
            <div class="kpi-label">vs Last Week</div>
            <div class="kpi-value ${trendCls}">${trendArrow} ${Math.abs(vs)}%</div>
            <div class="kpi-meta">${FW.badge("Estimated")} mock historical</div>
          </div>
        </div>

        <div class="quick-actions" style="margin-bottom:1.25rem">
          <a href="analysis.html">Analyze Today</a>
          <a href="route1.html">Reduce Waste</a>
          <a href="route2.html">Agricultural Use</a>
          <a href="route3.html">Create Target</a>
        </div>

        <div class="grid-2">
          <div class="card">
            <h3>แนวโน้ม 7 วัน (Waste/Person g)</h3>
            <div class="chart-box"><canvas id="trend"></canvas></div>
            <p class="caption">จุด 6 วันแรก = mock · วันนี้ = ค่าคำนวณจากมื้อล่าสุด</p>
          </div>
          <div class="card">
            <h3>องค์ประกอบวันนี้</h3>
            <div class="chart-box"><canvas id="donut"></canvas></div>
          </div>
        </div>

        <div class="card section">
          <h3>Top wasted foods</h3>
          <ol>${top.map(([k,v]) => `<li><strong>${FW.catLabel(k)}</strong> — ${F.roundDisplay(v,"kg")} kg</li>`).join("")}</ol>
        </div>

        ${simple ? "" : `
        <div class="card">
          <h3>รายละเอียด (Expert)</h3>
          <p class="mono">Prepared=${a.preparedTotal} kg · Waste=${a.wasteTotal} kg · Diners=${a.diners}
Consumed=${a.consumed} · WasteRate=${a.wasteRate}% · W/person=${a.wastePerPerson} kg</p>
        </div>`}
      `;

      new Chart(document.getElementById("trend"), {
        type: "line",
        data: {
          labels: ["D-6","D-5","D-4","D-3","D-2","D-1","Today"],
          datasets: [{
            data: series,
            borderColor: "#1B5E3B",
            backgroundColor: "rgba(27,94,59,0.1)",
            fill: true,
            tension: 0.3,
          }],
        },
        options: { plugins: { legend: { display: false } }, maintainAspectRatio: false },
      });
      const cats = Object.keys(a.wasteByCategory);
      new Chart(document.getElementById("donut"), {
        type: "doughnut",
        data: {
          labels: cats.map(FW.catLabel),
          datasets: [{ data: cats.map(k => a.wasteByCategory[k]), backgroundColor: FW.chartColors() }],
        },
        options: { plugins: { legend: { position: "bottom" } }, maintainAspectRatio: false },
      });
    }
    render();
  </script>
</body>
</html>
