<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>รายงาน — Food Waste Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="private-layout">
    <div id="app-sidebar"></div>
    <main class="private-main">
      <div class="page-title-row no-print">
        <div>
          <h1>Reports</h1>
          <p class="page-sub"><span data-school-name></span></p>
        </div>
        <button type="button" class="btn btn-primary" onclick="window.print()">พิมพ์ / Export</button>
      </div>
      <div class="tabs no-print" id="tabs">
        <button type="button" class="tab active" data-tab="daily">Daily</button>
        <button type="button" class="tab" data-tab="weekly">Weekly</button>
        <button type="button" class="tab" data-tab="monthly">Monthly</button>
      </div>
      <div id="content"></div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/formulas.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!FW.initPrivatePage("reports")) throw new Error("auth");
    const F = FW_FORMULAS;
    let tab = "daily";

    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-tab]");
      if (!btn) return;
      tab = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
      render();
    });

    function mealRows(meals) {
      return meals.map(m => {
        const a = F.analyzeMealWaste(m);
        return { meal: m, a };
      });
    }

    function aggregate(rows) {
      const totals = {
        prepared: 0, waste: 0, unserved: 0, plate: 0, liquid: 0, contam: 0, diners: 0,
        byCat: { rice:0, vegetable:0, fruit:0, protein:0, other:0 },
      };
      rows.forEach(({ a }) => {
        totals.prepared += a.preparedTotal;
        totals.waste += a.wasteTotal;
        totals.unserved += a.unservedTotal;
        totals.plate += a.plateTotal;
        totals.liquid += a.freeLiquidL;
        totals.contam += a.contaminationTotal;
        totals.diners += a.diners;
        Object.keys(totals.byCat).forEach(k => { totals.byCat[k] += a.wasteByCategory[k] || 0; });
      });
      const wpp = totals.diners ? totals.waste / totals.diners : NaN;
      const wr = totals.prepared ? (totals.waste / totals.prepared) * 100 : NaN;
      return { totals, wpp, wr };
    }

    function filterMeals(meals) {
      if (tab === "daily") return meals.slice(0, 1);
      if (tab === "weekly") return meals.slice(0, 7);
      return meals;
    }

    function render() {
      const meals = FW.getMeals();
      const root = document.getElementById("content");
      if (!meals.length) {
        root.innerHTML = FW.emptyState("ไม่มีข้อมูลรายงาน", ["Load demo day ที่ Kitchen"]);
        return;
      }
      const filtered = filterMeals(meals);
      const rows = mealRows(filtered);
      const { totals, wpp, wr } = aggregate(rows);
      const chem = F.analyzeCompostChemistry(totals.byCat, FW_DATA.foodMaterials);
      const decision = F.decisionEngine({
        contaminationTotal: totals.contam,
        solidWaste: totals.waste,
        freeLiquidL: totals.liquid,
        cn: chem.cn,
        mmix: chem.mmix,
        plantFraction: chem.plantFraction,
      });

      root.innerHTML = `
        <div class="card" style="margin-bottom:1rem">
          <h2>สรุป${tab === "daily" ? "รายวัน" : tab === "weekly" ? "รายสัปดาห์" : "รายเดือน"} (${filtered.length} มื้อ)</h2>
          <div class="kpi-grid">
            <div class="kpi"><div class="kpi-label">Total waste</div><div class="kpi-value" style="font-size:1.5rem">${F.roundDisplay(totals.waste,"kg")} kg</div></div>
            <div class="kpi"><div class="kpi-label">Waste/person</div><div class="kpi-value" style="font-size:1.5rem">${Number.isNaN(wpp)?"—":Math.round(wpp*1000)} g</div></div>
            <div class="kpi"><div class="kpi-label">Waste rate</div><div class="kpi-value" style="font-size:1.5rem">${F.roundDisplay(wr,"pct")}%</div></div>
            <div class="kpi"><div class="kpi-label">Diners</div><div class="kpi-value" style="font-size:1.5rem">${totals.diners}</div></div>
          </div>
        </div>
        <div class="grid-2">
          <div class="card">
            <h3>Unserved vs Plate</h3>
            <p>Unserved: <strong>${F.roundDisplay(totals.unserved,"kg")} kg</strong></p>
            <p>Plate waste: <strong>${F.roundDisplay(totals.plate,"kg")} kg</strong></p>
            <p>Free liquid: <strong>${F.roundDisplay(totals.liquid,"kg")} L</strong></p>
            <p>Contamination: <strong>${F.roundDisplay(totals.contam,"kg")} kg</strong></p>
          </div>
          <div class="card">
            <h3>Composition</h3>
            <ul>${Object.entries(totals.byCat).map(([k,v]) =>
              `<li>${FW.catLabel(k)}: ${F.roundDisplay(v,"kg")} kg (${F.roundDisplay(F.share(v,totals.waste),"pct")}%)</li>`
            ).join("")}</ul>
          </div>
        </div>
        <div class="card section">
          <h3>Recommendations summary</h3>
          <p><strong>${decision.recommendation}</strong> — C:N ${F.roundDisplay(chem.cn,"cn")}, Moisture ${F.roundDisplay(chem.mmix*100,"pct")}%</p>
          <ul>${decision.reasons.map(r => `<li>${r}</li>`).join("")}</ul>
        </div>
        <div class="card">
          <h3>มื้อในรายงาน</h3>
          <div class="table-wrap"><table class="data">
            <thead><tr><th>วันที่</th><th>เมนู</th><th>Diners</th><th>Waste kg</th><th>Rate %</th><th>g/คน</th></tr></thead>
            <tbody>
              ${rows.map(({meal,a}) => `<tr>
                <td>${meal.date}</td><td>${meal.menuName||"—"}</td><td>${a.diners}</td>
                <td>${F.roundDisplay(a.wasteTotal,"kg")}</td>
                <td>${F.roundDisplay(a.wasteRate,"pct")}</td>
                <td>${Math.round(a.wastePerPerson*1000)}</td>
              </tr>`).join("")}
            </tbody>
          </table></div>
        </div>
      `;
    }
    render();
  </script>
</body>
</html>
