<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>วิเคราะห์ขยะอาหาร — Food Waste Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="private-layout">
    <div id="app-sidebar"></div>
    <main class="private-main">
      <div class="page-title-row">
        <div>
          <h1>Food Waste Analysis</h1>
          <p class="page-sub">แยกของแข็ง / ของเหลว / การปนเปื้อน · คำนวณ Share, DM, C, N</p>
        </div>
        <label class="switch"><input type="checkbox" id="expert-toggle" /> Expert Mode</label>
      </div>
      <div id="content"></div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/formulas.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!FW.initPrivatePage("analysis")) throw new Error("auth");
    const F = FW_FORMULAS;
    const expert = document.getElementById("expert-toggle");
    expert.checked = FW.isExpertMode();
    expert.addEventListener("change", () => { FW.setExpertMode(expert.checked); render(); });

    function render() {
      const meal = FW.getLatestMeal();
      const root = document.getElementById("content");
      if (!meal) {
        root.innerHTML = FW.emptyState("INSUFFICIENT DATA", ["มื้ออาหารใน Kitchen Input"]);
        return;
      }
      const a = F.analyzeMealWaste(meal);
      const chem = F.analyzeCompostChemistry(a.wasteByCategory, FW_DATA.foodMaterials);

      root.innerHTML = `
        ${FW.lowConfidenceBanner()}
        <div class="kpi-grid" style="margin-bottom:1rem">
          <div class="card kpi"><div class="kpi-label">Solid waste</div><div class="kpi-value">${F.roundDisplay(a.wasteTotal,"kg")}<span class="kpi-unit">kg</span></div></div>
          <div class="card kpi"><div class="kpi-label">Unserved</div><div class="kpi-value">${F.roundDisplay(a.unservedTotal,"kg")}<span class="kpi-unit">kg</span></div></div>
          <div class="card kpi"><div class="kpi-label">Plate waste</div><div class="kpi-value">${F.roundDisplay(a.plateTotal,"kg")}<span class="kpi-unit">kg</span></div></div>
          <div class="card kpi"><div class="kpi-label">Free liquid / Contam.</div><div class="kpi-value" style="font-size:1.3rem">${a.freeLiquidL} L / ${F.roundDisplay(a.contaminationTotal,"kg")} kg</div></div>
        </div>
        <div class="grid-2">
          <div class="card">
            <h3>องค์ประกอบขยะแข็ง</h3>
            <div class="chart-box"><canvas id="donut"></canvas></div>
          </div>
          <div class="card">
            <h3>เคมีโดยประมาณ ${FW.badge("Calculated")}</h3>
            <p><strong>C:N</strong> = ${F.roundDisplay(chem.cn,"cn")} · <strong>Mmix</strong> = ${F.roundDisplay(chem.mmix*100,"pct")}%</p>
            <p>Ctotal=${F.roundDisplay(chem.ctotal,"kg")} kg · Ntotal=${F.roundDisplay(chem.ntotal,"kg")} kg · DM=${F.roundDisplay(chem.dmTotal,"kg")} kg</p>
            <div class="btn-row">
              <a class="btn btn-primary btn-sm" href="route2.html">ไป Route 2</a>
              <a class="btn btn-outline btn-sm" href="route3.html">ไป Route 3</a>
            </div>
          </div>
        </div>
        <div class="card section">
          <h3>รายหมวด</h3>
          <div class="table-wrap"><table class="data">
            <thead><tr><th>หมวด</th><th>W kg</th><th>Share %</th><th>DM</th><th>Water</th><th>C</th><th>N</th></tr></thead>
            <tbody>
              ${chem.rows.map(r => `<tr>
                <td>${FW.catLabel(r.key)}</td>
                <td>${F.roundDisplay(r.w,"kg")}</td>
                <td>${F.roundDisplay(r.share,"pct")}</td>
                <td>${F.roundDisplay(r.dm,"kg")}</td>
                <td>${F.roundDisplay(r.water,"kg")}</td>
                <td>${F.roundDisplay(r.c,"kg")}</td>
                <td>${F.roundDisplay(r.n,"kg")}</td>
              </tr>`).join("")}
            </tbody>
          </table></div>
          ${FW.isExpertMode() ? chem.rows.map(r => `<p class="mono">Share=${r.key}: ${r.w}/${chem.wtotal}×100; DM=${r.w}×(1-${r.moisture}); C=${r.dm}×${r.carbonFrac}; N=${r.dm}×${r.nitrogenFrac}</p>`).join("") : ""}
          ${FW.howCalculatedPanel("how-analysis", "Food Waste Analysis", [
            `Wtotal = ${chem.wtotal}`,
            `Ctotal = ${chem.ctotal}`,
            `Ntotal = ${chem.ntotal}`,
            `C:N = Ctotal/Ntotal = ${chem.cn}`,
            `Mmix = Σ(W×M)/ΣW = ${chem.mmix}`,
          ])}
        </div>
        <p class="disclaimer">ค่า C/N จาก Database Reference — เป็นเคมีขยะดิบ ไม่ใช่ปุ๋ยหมักสำเร็จรูป</p>
      `;

      new Chart(document.getElementById("donut"), {
        type: "doughnut",
        data: {
          labels: chem.rows.map(r => FW.catLabel(r.key)),
          datasets: [{ data: chem.rows.map(r => r.w), backgroundColor: FW.chartColors() }],
        },
        options: { plugins: { legend: { position: "bottom" } }, maintainAspectRatio: false },
      });
    }
    render();
  </script>
</body>
</html>
